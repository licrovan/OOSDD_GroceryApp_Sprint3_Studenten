name: MAUI Unit Tests
 
on:
  push:
    branches:
      - main
      - infra/runner-toevoegen
      - testing
      - feat/pipeline_test
      - development
  pull_request:
    branches:
      - main
      - testing
      - development
      - feat/pipeline_test
 
jobs:
  test:
    runs-on: windows-latest  # Of windows-latest/macOS-latest als specifiek platform nodig is (orgianaly ubuntu-latest)
    steps:
      - name: Haal de repository op
        uses: actions/checkout@v4
 
      - name: Installeer .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'  # Gebruik de juiste versie voor MAUI

      - name: Installeer MAUI workloads
        run: dotnet workload install maui-android maui-windows maui-ios maui-maccatalyst

      - name: Restore for win-x64
        run: dotnet restore --runtime win-x64

      - name: Restore dependencies
        run: dotnet restore
 
      - name: Bouw de applicatie
        run: dotnet build --configuration Release --no-restore
 
      - name: Voer unit tests uit
        run: dotnet test TestCore/TestCore.csproj --configuration Release --no-restore --no-build --verbosity normal